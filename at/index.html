<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:,">
<title>Shared location · 공유된 위치</title>
<meta name="description" content="Open a shared location in Google Maps, Apple Maps, KakaoMap, Naver Map or TMAP.">
<meta property="og:type" content="website">
<meta property="og:title" content="Shared location · 공유된 위치">
<meta property="og:description" content="Open in Google Maps, Apple Maps, KakaoMap, Naver Map or TMAP · Google 지도·Apple 지도·카카오맵·네이버 지도·티맵에서 열기">
<meta property="og:url" content="https://droidactor.github.io/at/">
<meta property="og:image" content="https://droidactor.github.io/assets/icons/gps.png">
<!--
  Location share page for Dotori GPS (com.droidactor.gps).
  Link format (never change, links are permanent): /at/#1,<lat>,<lng>[,<encoded name>]
  The data after '#' stays in the browser and is never sent to the server.
  No external requests, no analytics. Button URIs were verified on Android Chrome, Samsung Internet
  and the KakaoTalk in-app browser (2026-11-03). Spec: mobile repo apps/gps/docs/gps-app-design.md §3-3.
-->
<style>
  :root { --bg: #ffffff; --fg: #1b1b1b; --muted: #666; --card: #f3f3f3; --line: #d0d0d0; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #ececec; --muted: #a0a0a0; --card: #1f1f1f; --line: #3a3a3a; --accent: #8ab4ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 32px; }
  .languages { display: flex; justify-content: flex-end; gap: 4px; margin: 0 0 12px; }
  .languages a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 12px;
                 border-radius: 8px; color: var(--muted); font-size: 14px; text-underline-offset: 3px; }
  .languages a[aria-current="page"] { background: var(--card); color: var(--fg); font-weight: 600; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  h1 { font-size: 22px; margin: 0 0 6px; word-break: break-word; }
  .coords { color: var(--muted); font-size: 15px; margin: 0 0 20px; font-variant-numeric: tabular-nums; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .promo { margin: 0 0 20px; padding: 0 0 14px; border-bottom: 1px solid var(--line); color: var(--muted);
           font-size: 12px; line-height: 1.5; }
  .brand .app { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; color: var(--fg);
                text-decoration: none; }
  .brand .app img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
  .brand .app span { display: flex; flex-direction: column; min-width: 0; }
  .brand .app b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .app small { font-size: 12px; color: var(--muted); }
  .brand .play img { display: block; width: auto; height: 40px; }
  @media (max-width: 360px) { .brand .play img { height: 32px; } }
  .btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; margin: 0 0 10px;
         border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg);
         font: inherit; font-size: 16px; text-align: left; text-decoration: none; cursor: pointer; }
  .btn:active { opacity: .7; }
  .btn img, .btn svg { width: 28px; height: 28px; border-radius: 6px; flex: none; }
  .note { color: var(--muted); font-size: 14px; min-height: 20px; margin: 4px 0 0; }
</style>
</head>
<body>
<main>
  <nav class="languages" aria-label="Language / 언어">
    <a id="language-ko" lang="ko" hreflang="ko">한국어</a>
    <a id="language-en" lang="en" hreflang="en">English</a>
  </nav>
  <header class="brand" id="brand"></header>
  <p class="promo" id="promo"></p>
  <h1 id="title"></h1>
  <p class="coords" id="coords"></p>
  <div id="buttons"></div>
  <p class="note" id="note" aria-live="polite"></p>
  <noscript><p>JavaScript is required. · JavaScript가 필요합니다.</p></noscript>
</main>
<script>
(function () {
  'use strict';
  // A shared location stays language-neutral unless its recipient chooses a language.
  // Promotional captures can use ?lang=en before the permanent #1,... location payload.
  var languageKey = 'dotori-at-language';
  function supportedLanguage(value) { return value === 'ko' || value === 'en' ? value : null; }
  var savedLanguage = null;
  try { savedLanguage = supportedLanguage(localStorage.getItem(languageKey)); } catch (err) { /* Storage can be blocked. */ }
  var language = supportedLanguage(new URLSearchParams(location.search).get('lang')) || savedLanguage ||
    (/^ko\b/i.test(navigator.language || '') ? 'ko' : 'en');
  var KO = language === 'ko';
  ['ko', 'en'].forEach(function (value) {
    var choice = document.getElementById('language-' + value);
    var url = new URL(location.href);
    url.searchParams.set('lang', value);
    choice.href = url.href; // Preserve coordinates, encoded names and relay parameters verbatim in the hash.
    if (value === language) choice.setAttribute('aria-current', 'page');
    choice.addEventListener('click', function () {
      try { localStorage.setItem(languageKey, value); } catch (err) { /* The URL still carries the choice. */ }
    });
  });
  var T = KO ? {
    shared: '공유된 위치', invalid: '잘못된 링크입니다.', copy: '좌표 복사', copied: '좌표를 복사했습니다.',
    kakao: '카카오맵에서 열기', naver: '네이버 지도에서 열기', tmapRoute: '티맵 길안내', tmapView: '티맵 지도에서 보기',
    google: 'Google 지도에서 열기', apple: 'Apple 지도에서 열기', appName: '도토리 GPS 기록기', sharedBy: '이 위치를 공유한 앱', product: '/ko/apps/gps/',
    download: 'Google Play에서 다운로드',
    promo: '이 페이지는 도토리 GPS 기록기의 위치 공유로 만들어졌습니다.',
    install: '내 위치를 이렇게 보내려면 Android 앱을 설치해 보세요.'
  } : {
    shared: 'Shared location', invalid: 'This link is not valid.', copy: 'Copy coordinates', copied: 'Coordinates copied.',
    kakao: 'Open in KakaoMap', naver: 'Open in Naver Map', tmapRoute: 'Directions in TMAP', tmapView: 'View in TMAP',
    google: 'Open in Google Maps', apple: 'Open in Apple Maps', appName: 'Dotori GPS Tracker', sharedBy: 'Shared this location', product: '/apps/gps/',
    download: 'Get it on Google Play',
    promo: 'This page was made with location sharing in Dotori GPS Tracker.',
    install: 'To send places like this, install the Android app.'
  };
  document.documentElement.lang = KO ? 'ko' : 'en';

  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  function icon(src) {
    var img = document.createElement('img');
    img.src = src;
    img.alt = '';
    return img;
  }

  // Top bar: the app that shared this link, and where to get it.
  var brand = document.getElementById('brand');
  var link = document.createElement('a');
  link.className = 'app';
  link.href = T.product;
  link.appendChild(icon('/assets/icons/gps.png'));
  var appText = document.createElement('span');
  var appName = document.createElement('b');
  appName.textContent = T.appName;
  var appNote = document.createElement('small');
  appNote.textContent = T.sharedBy;
  appText.appendChild(appName);
  appText.appendChild(appNote);
  link.appendChild(appText);
  brand.appendChild(link);
  // iOS cannot install the Android app, so the install hint is dropped there.
  document.getElementById('promo').textContent = ios ? T.promo : T.promo + ' ' + T.install;
  // Android-only app: no download badge on iOS. Same badge files and URL form as the product pages.
  if (!ios) {
    var play = document.createElement('a');
    play.className = 'play';
    play.href = 'https://play.google.com/store/apps/details?id=com.droidactor.gps&hl=' + (KO ? 'ko' : 'en');
    var badge = document.createElement('img');
    badge.src = '/assets/google-play-badge-' + (KO ? 'ko' : 'en') + '.png';
    badge.width = 646;
    badge.height = 250;
    badge.alt = T.download;
    play.appendChild(badge);
    brand.appendChild(play);
  }

  // Opening another shared link in a reused tab only changes the hash (no reload) — redraw from scratch.
  window.addEventListener('hashchange', function () { location.reload(); });

  // #1,<lat>,<lng>[,<encoded name>]. The app never leaves a raw '?' or '&' in the hash, so anything
  // after one was appended by a relay (fbclid, utm_*) and is ignored.
  function parse(hash) {
    var f = hash.replace(/^#/, '').split(/[?&]/)[0].split(',');
    if (f[0] !== '1' || f.length < 3) return null;
    var num = /^-?\d{1,3}(\.\d+)?$/;
    if (!num.test(f[1]) || !num.test(f[2])) return null;
    var lat = Number(f[1]), lng = Number(f[2]);
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    var name = '';
    if (f.length > 3) { // a relay may have decoded %2C back to ',' — keep the rest as the name
      try { name = decodeURIComponent(f.slice(3).join(',')).trim(); } catch (e) { name = ''; }
    }
    return { lat: lat.toFixed(6), lng: lng.toFixed(6), name: name };
  }

  var p = parse(location.hash);
  var title = document.getElementById('title');
  document.title = T.shared;
  if (!p) { title.textContent = T.invalid; return; }

  var label = p.name || T.shared;
  title.textContent = label;
  document.getElementById('coords').textContent = p.lat + ', ' + p.lng;

  var e = encodeURIComponent, name = e(label), c = p.lat + ',' + p.lng;
  var kakaoWeb = 'https://map.kakao.com/link/map/' + name + ',' + c;
  var googleWeb = 'https://www.google.com/maps/search/?api=1&query=' + c;

  // Android: intent:// with package so a missing app falls back (web map or Play Store) instead of doing nothing.
  function intent(path, scheme, pkg, fallback) {
    return 'intent://' + path + '#Intent;scheme=' + scheme + ';package=' + pkg +
      (fallback ? ';S.browser_fallback_url=' + e(fallback) : '') + ';end';
  }
  function app(path, scheme, pkg, fallback) {
    if (android) return intent(path, scheme, pkg, fallback);
    if (ios) return scheme + '://' + path;
    return fallback || null;
  }

  // Local listing icons: Google Play for Android maps, Apple's App Store for Apple Maps (id 915056765).
  var I = '/assets/icons/maps/';
  var kakao = [T.kakao, app('look?p=' + c, 'kakaomap', 'net.daum.android.map', kakaoWeb), I + 'kakao.png'];
  var naver = [T.naver, app('place?lat=' + p.lat + '&lng=' + p.lng + '&name=' + name + '&appname=com.droidactor.gps',
    'nmap', 'com.nhn.android.nmap', null), I + 'naver.png'];
  var tmapRoute = [T.tmapRoute, app('route?goalname=' + name + '&goalx=' + p.lng + '&goaly=' + p.lat,
    'tmap', 'com.skt.tmap.ku', null), I + 'tmap.png'];
  var tmapView = [T.tmapView, app('viewmap?x=' + p.lng + '&y=' + p.lat + '&name=' + name,
    'tmap', 'com.skt.tmap.ku', null), I + 'tmap.png'];
  var google = [T.google, googleWeb, I + 'google.jpg'];
  // HTTPS also offers a web map when the native Apple Maps app is unavailable.
  var apple = [T.apple, 'https://maps.apple.com/?ll=' + e(c) + '&q=' + name, I + 'apple.png'];
  var order = KO ? [kakao, naver, tmapRoute, tmapView, google] : [google, kakao, naver, tmapRoute, tmapView];
  order.splice(ios ? 0 : order.indexOf(google) + 1, 0, apple);

  function addText(el, text) {
    var s = document.createElement('span');
    s.textContent = text;
    el.appendChild(s);
  }

  var box = document.getElementById('buttons');
  order.forEach(function (b) {
    if (!b[1]) return; // desktop: app-only maps have no web fallback
    var a = document.createElement('a');
    a.className = 'btn';
    a.href = b[1];
    a.appendChild(icon(b[2]));
    addText(a, b[0]);
    box.appendChild(a);
  });

  var note = document.getElementById('note');
  var copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'btn';
  // Material "content_copy" outline, drawn in the text color.
  copy.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>';
  addText(copy, T.copy);
  copy.addEventListener('click', function () {
    var text = p.lat + ', ' + p.lng;
    function done() { note.textContent = T.copied; }
    function legacy() {
      var t = document.createElement('textarea');
      t.value = text;
      t.setAttribute('readonly', '');
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(t);
      note.textContent = ok ? T.copied : text;
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, legacy);
    else legacy();
  });
  box.appendChild(copy);
})();
</script>
</body>
</html>
